events {}
http {
  upstream api_pool {
    server api-a:8080;
    server api-b:8080;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s; # long-lived WS connections
    }
  }
}
